server:
  port: 8080

spring:
  application:
    name: auth-data-plane
  datasource:
    url: jdbc:postgresql://${AUTH_DB_HOST:localhost}:${AUTH_DB_PORT:5432}/${AUTH_DB_NAME:auth_saas}
    username: ${AUTH_DB_USER:auth}
    password: ${AUTH_DB_PASSWORD:auth}
  data:
    redis:
      host: ${AUTH_REDIS_HOST:localhost}
      port: ${AUTH_REDIS_PORT:6379}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false
  security:
    oauth2:
      client:
        registration: {}

auth:
  jwt:
    issuer: ${AUTH_JWT_ISSUER:https://auth.saas.local}
    access-token-ttl-seconds: 900
    refresh-token-ttl-seconds: 2592000
    public-key: classpath:keys/public.pem
    private-key: classpath:keys/private.pem
  crypto:
    argon2:
      memory-kb: 65536
      iterations: 3
      parallelism: 1

management:
  endpoints:
    web:
      exposure:
        include: health,info
